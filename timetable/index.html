<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<script>try{var t=localStorage.getItem("timetable:theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="TIMETABLE — 하루를 타임라인으로 계획하고, 통계로 돌아보는 시간관리 앱">
<title>TIMETABLE</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500;1,6..72,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<!-- 로그인 화면 (서비스 모드에서 로그인 전에만 보인다) -->
<main class="screen" id="authView" hidden>
  <div class="screen-inner">
    <div class="auth-hero">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24.3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><line x1="26" y1="26" x2="26" y2="14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="26" x2="35" y2="31" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="26" cy="26" r="1.8" fill="currentColor"/></svg>
      </div>
      <h1 class="auth-title">TIMETABLE</h1>
      <p class="auth-sub">하루를 타임라인으로 계획하고,<br>통계로 돌아보세요.</p>
    </div>

    <form class="auth-form" id="authForm" novalidate>
      <label class="auth-label" for="authEmail">이메일</label>
      <input class="auth-input" type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" inputmode="email">
      <button class="btn btn-save auth-btn" id="authEmailBtn" type="submit">로그인 링크 받기</button>
      <p class="auth-hint">비밀번호 없이, 메일로 받은 링크를 누르면 바로 로그인돼요.<br>처음이면 자동으로 가입돼요.</p>
    </form>

    <div class="auth-sent" id="authSent" hidden>
      <div class="auth-sent-icon" aria-hidden="true">✉</div>
      <h2>메일함을 확인해 주세요</h2>
      <p><b id="authSentEmail"></b> 로 로그인 링크를 보냈어요.<br>링크를 누르면 이 화면이 자동으로 앱으로 바뀌어요.</p>
      <button class="auth-link" id="authResendBtn" type="button">다시 보내기</button>
      <button class="auth-link" id="authBackBtn" type="button">다른 이메일로 시도</button>
    </div>

    <div class="auth-divider" id="authDivider"><span>또는</span></div>
    <button class="btn auth-google" id="authGoogleBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ea4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8a6.1 6.1 0 1 1 0-12.2c1.9 0 3.2.8 3.9 1.5l2.7-2.6A9.8 9.8 0 0 0 12 2.2a9.8 9.8 0 1 0 0 19.6c5.7 0 9.4-4 9.4-9.6 0-.6-.1-1.1-.2-2H12z"/></svg>
      Google로 계속하기
    </button>
    <p class="auth-error" id="authError" role="alert" hidden></p>
  </div>
</main>

<!-- 치명적 오류 (저장소 연결/데이터 불러오기 실패) -->
<main class="screen" id="fatalView" hidden>
  <div class="screen-inner">
    <div class="fatal">
      <h1>앱을 불러오지 못했어요</h1>
      <p id="fatalMsg">네트워크 연결을 확인하고 다시 시도해 주세요.</p>
      <button class="btn btn-save" id="fatalRetryBtn" type="button">다시 시도</button>
    </div>
  </div>
</main>

<!-- 온보딩 (가입 직후 / 설정에서 '사용법 다시 보기') -->
<main class="screen" id="onboardView" hidden>
  <div class="screen-inner">
    <div class="ob-top">
      <div class="ob-dots" id="obDots"></div>
      <button class="ob-skip" id="obSkipBtn" type="button">건너뛰기</button>
    </div>
    <div class="ob-body" id="obBody"></div>
    <div class="ob-actions">
      <button class="btn btn-cancel" id="obBackBtn" type="button">이전</button>
      <button class="btn btn-save" id="obNextBtn" type="button">다음</button>
    </div>
  </div>
</main>

<div id="mainView" hidden>
<div class="app-header" id="appHeader">
  <div class="topbar">
    <div class="brand">
      <span class="brand-date" id="dateLabel"></span>
      <button class="today-chip" id="todayChip" hidden aria-label="오늘로 돌아가기">돌아가기</button>
      <span class="dday-chip" id="ddayChip" hidden></span>
      <span class="dday-chip" id="memoChip" hidden></span>
    </div>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="설정 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <div class="now-hero">
    <div class="now-clock">
      <svg viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="24.3" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
        <line id="hourHand" x1="26" y1="26" x2="26" y2="15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <line id="minHand" x1="26" y1="26" x2="26" y2="10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="26" cy="26" r="1.6" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <div class="now-time" id="nowTime">--:--</div>
      <div class="now-label">지금</div>
    </div>
  </div>
</div>

<div class="app">
  <div class="timeline-wrap" id="timelineWrap">
    <div class="rail"></div>
    <!-- hour rows, blocks, now-line injected by JS -->
  </div>
</div>

<button class="fab" id="addBtn" aria-label="일정 추가">
  <svg viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="10.5" y1="1.3" x2="10.5" y2="19.7"/><line x1="1.3" y1="10.5" x2="19.7" y2="10.5"/></svg>
</button>

<nav class="tabbar">
  <button class="tab-item active" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/></svg>
    <span>타임라인</span>
    <span class="tab-dot"></span>
  </button>
  <button class="tab-item" data-tab="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
    <span>캘린더</span>
    <span class="tab-dot"></span>
  </button>
  <button class="tab-item" data-tab="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    <span>통계</span>
    <span class="tab-dot"></span>
  </button>
  <button class="tab-item" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="10" cy="18" r="2"/></svg>
    <span>설정</span>
    <span class="tab-dot"></span>
  </button>
</nav>
</div>

<div class="toast" id="toast"></div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-handle"></div>
  <h2 id="sheetTitle">새 일정</h2>
  <div class="field">
    <label for="fTitle">제목</label>
    <input type="text" id="fTitle" placeholder="예: 수학 공부">
  </div>
  <div class="time-row">
    <div class="field">
      <label for="fStartBtn">시작</label>
      <input type="hidden" id="fStart">
      <button type="button" class="time-field" id="fStartBtn">
        <span id="fStartText">오전 09:00</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/></svg>
      </button>
    </div>
    <div class="field">
      <label for="fEndBtn">종료</label>
      <input type="hidden" id="fEnd">
      <button type="button" class="time-field" id="fEndBtn">
        <span id="fEndText">오전 09:30</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/></svg>
      </button>
    </div>
  </div>
  <div class="field-label-row">
    <label>카테고리</label>
    <button type="button" class="add-cat-btn" id="addCatBtn" aria-label="카테고리 추가">+</button>
  </div>
  <div class="chip-row" id="chipRow"></div>
  <div class="sheet-actions">
    <button class="btn btn-cancel" id="cancelBtn">취소</button>
    <button class="btn btn-save" id="saveBtn">저장</button>
  </div>
  <button class="btn-delete" id="deleteBtn" hidden>이 일정 삭제</button>
</div>

<div class="tp-backdrop" id="tpBackdrop" hidden></div>
<div class="tp-sheet" id="tpSheet" hidden>
  <div class="tp-handle"></div>
  <div class="tp-head">
    <button type="button" class="tp-cancel" id="tpCancelBtn">취소</button>
    <div class="tp-title" id="tpTitle">시작 시간</div>
    <button type="button" class="tp-done" id="tpDoneBtn">완료</button>
  </div>
  <div class="tp-wheels">
    <div class="tp-highlight"></div>
    <div class="tp-col" id="tpAmpm"></div>
    <div class="tp-col" id="tpHour"></div>
    <div class="tp-col" id="tpMin"></div>
  </div>
</div>

<div class="cat-backdrop" id="catBackdrop" hidden></div>
<div class="cat-sheet" id="catSheet" hidden>
  <div class="sheet-handle"></div>
  <h2 id="catSheetTitle">새 카테고리</h2>
  <div class="field">
    <label for="catNameInput">이름</label>
    <input type="text" id="catNameInput" placeholder="예: 독서" maxlength="10">
  </div>
  <div class="field">
    <label>색상</label>
    <div class="cat-swatch-row" id="catSwatchRow"></div>
  </div>
  <div class="field" id="catGoalField" hidden>
    <label for="catGoalInput">주간 목표 (시간, 비우면 없음)</label>
    <input type="text" id="catGoalInput" inputmode="decimal" placeholder="예: 10" maxlength="5">
  </div>
  <p class="cat-error" id="catError" role="alert" hidden></p>
  <div class="sheet-actions">
    <button class="btn btn-cancel" id="catCancelBtn">취소</button>
    <button class="btn btn-save" id="catSaveBtn">추가</button>
  </div>
</div>

<div class="cal-backdrop" id="calBackdrop" hidden></div>
<div class="cal-sheet" id="calSheet" hidden>
  <div class="sheet-handle cal-handle"></div>
  <div class="cal-header">
    <div class="cal-title" id="calTitle"></div>
    <button class="cal-close" id="calCloseBtn" aria-label="캘린더 닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="cal-month-row">
    <div class="cal-month-label" id="calMonthLabel"></div>
    <div class="cal-month-nav">
      <button id="calPrevBtn" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button id="calNextBtn" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </div>
  <div class="cal-notes">
    <div class="cal-holiday-list" id="calHolidayList"></div>
    <div class="cal-dday-month" id="calDdayMonth" hidden></div>
  </div>
  <div class="cal-weekdays" id="calWeekdays"></div>
  <div class="cal-grid" id="calGrid"></div>
  <section class="cal-dday">
    <div class="cal-dday-head">
      <span class="cal-dday-title">메모</span>
      <button type="button" class="cal-dday-add" id="memoAddBtn">+ 메모</button>
    </div>
    <div class="cal-dday-list" id="memoList"></div>
  </section>
  <section class="cal-dday">
    <div class="cal-dday-head">
      <span class="cal-dday-title">디데이</span>
      <button type="button" class="cal-dday-add" id="ddayAddBtn">+ 디데이</button>
    </div>
    <div class="cal-dday-list" id="ddayList"></div>
  </section>
</div>

<div class="dday-backdrop" id="ddayBackdrop" hidden></div>
<div class="dday-sheet" id="ddaySheet" hidden>
  <div class="sheet-handle"></div>
  <h2 id="ddaySheetTitle">새 디데이</h2>
  <div class="field">
    <label for="ddayTitleInput" id="ddayTitleLabel">이벤트 이름</label>
    <input type="text" id="ddayTitleInput" placeholder="예: 생일" maxlength="30">
  </div>
  <div class="field">
    <div class="dday-date-label">
      <label>날짜</label>
      <span class="dday-preview" id="ddayPreview"></span>
    </div>
    <div class="tp-wheels">
      <div class="tp-highlight"></div>
      <div class="tp-col" id="ddayYear"></div>
      <div class="tp-col" id="ddayMonth"></div>
      <div class="tp-col" id="ddayDay"></div>
    </div>
  </div>
  <p class="cat-error" id="ddayError" role="alert" hidden></p>
  <div class="sheet-actions">
    <button class="btn btn-cancel" id="ddayCancelBtn">취소</button>
    <button class="btn btn-save" id="ddaySaveBtn">저장</button>
  </div>
  <button class="btn-delete" id="ddayDeleteBtn" hidden>이 디데이 삭제</button>
</div>

<div class="stats-backdrop" id="statsBackdrop" hidden></div>
<div class="stats-sheet" id="statsSheet" hidden>
  <div class="stats-header">
    <div class="stats-title">통계</div>
    <button class="cal-close" id="statsCloseBtn" aria-label="통계 닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="stats-body" id="statsBody"></div>
</div>


<div class="set-backdrop" id="settingsBackdrop" hidden></div>
<div class="set-sheet" id="settingsSheet" hidden>
  <div class="stats-header">
    <div class="stats-title">설정</div>
    <button class="cal-close" id="settingsCloseBtn" aria-label="설정 닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="set-body" id="settingsBody"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
